<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Royale Bistro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-login-body">
    <!-- Theme Toggle Button (Positioned by CSS class) -->
    <div class="login-theme-toggle">
      <button
        id="adminThemeToggle"
        class="theme-btn-admin"
        title="Toggle Theme"
      >
        <svg id="adminThemeIcon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="login-box">
      <div class="login-logo">
        Royale <span>Bistro</span>
        <span class="admin-badge">Admin</span>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Enter username"
            value="admin"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            value="password123"
            required
          />
        </div>
        <button type="submit" class="btn filled">Login to Dashboard</button>
      </form>

      <a href="index.html" class="back-link">← Back to Customer Site</a>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
