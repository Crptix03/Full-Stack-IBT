<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Royale Bistro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-dashboard-body">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <div class="logo">Royale <span>Bistro</span></div>
        <button
          id="closeMobileMenu"
          class="mobile-close-btn"
          title="Close Menu"
        >
          ✕
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="active" data-page="orders"><span>📦</span> Orders</a>
        <a href="#" data-page="menu"><span>🍽️</span> Manage Menu</a>
        <a href="#" id="adminLogoutBtn"><span>🚪</span> Logout</a>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <button id="mobileMenuToggle" class="mobile-menu-btn" title="Menu">
          ☰
        </button>
        <h1 id="pageTitle">Order Management</h1>

        <div class="admin-user">
          <!-- Theme Toggle Button -->
          <button
            id="adminThemeToggle"
            class="theme-btn-admin"
            title="Toggle Theme"
          >
            <svg id="adminThemeIcon">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span id="adminThemeLabel" class="theme-label">Dark</span>
          </button>
          <span>👤 Admin</span>
        </div>
      </header>

      <section class="admin-content">
        <!-- ORDERS SECTION -->
        <div id="ordersSection">
          <div class="admin-stats">
            <div class="stat-card">
              <span>Total Orders</span><strong id="statTotal">0</strong>
            </div>
            <div class="stat-card">
              <span>Pending</span><strong id="statPending">0</strong>
            </div>
            <div class="stat-card">
              <span>Completed</span><strong id="statCompleted">0</strong>
            </div>
          </div>

          <div class="admin-table-wrap">
            <h2>Recent Orders</h2>
            <div id="adminOrdersContainer">
              <p class="no-results">No orders have been placed yet.</p>
            </div>
          </div>
        </div>

        <!-- MENU SECTION -->
        <div id="menuSection" style="display: none">
          <div class="admin-table-wrap">
            <div class="menu-header-actions">
              <h2>Current Menu Items</h2>
              <button id="openAddMenuBtn" class="btn filled btn-add-item">
                + Add New Item
              </button>
            </div>

            <div id="adminMenuContainer">
              <p class="no-results">Loading menu items...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ADD/EDIT MENU MODAL -->
    <div class="modal-overlay" id="addMenuModal">
      <div class="modal-card">
        <h2 id="modalTitle">Add New Menu Item</h2>
        <form id="addMenuForm">
          <div class="form-group">
            <label for="menuName">Item Name</label>
            <input
              type="text"
              id="menuName"
              required
              placeholder="e.g. Truffle Fries"
            />
          </div>
          <div class="form-group">
            <label for="menuCategory">Category</label>
            <select id="menuCategory" required>
              <option value="starters">Starters</option>
              <option value="mains" selected>Main Course</option>
              <option value="soups">Soups</option>
              <option value="desserts">Desserts</option>
              <option value="drinks">Drinks</option>
            </select>
          </div>
          <div class="form-group">
            <label for="menuPrice">Price (Birr)</label>
            <input
              type="number"
              id="menuPrice"
              required
              placeholder="e.g. 450"
            />
          </div>
          <div class="form-group">
            <label for="menuImg">Image URL (Filename)</label>
            <input
              type="text"
              id="menuImg"
              required
              placeholder="e.g. truffle-fries.jpg"
            />
          </div>
          <div class="form-group">
            <label for="menuDesc">Description</label>
            <textarea
              id="menuDesc"
              rows="3"
              required
              placeholder="Describe the dish..."
            ></textarea>
          </div>
          <input type="hidden" id="editIndex" value="-1" />

          <div class="modal-actions">
            <button type="submit" id="modalSubmitBtn" class="btn filled">
              Add Item
            </button>
            <button type="button" id="closeAddMenuBtn" class="btn btn-cancel">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="admin.js"></script>
  </body>
</html>
