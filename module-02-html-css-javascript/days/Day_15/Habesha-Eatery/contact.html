<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Habesha Eatery, Bole</title>
    <meta name="description" content="Habesha Eatery Contact" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="first">
      <div class="logo">
        <header>
          <h1>Habesha Eatery</h1>
        </header>
      </div>
      <div class="nav">
        <nav>
          <ul class="link">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#menu">Menu</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
            <li>
              <a href="reserve.html">Reserve</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
    <main>
      <form>
        <fieldset>
          <legend>Contact</legend>
          <div class="name">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              required
              placeholder="Alewu Bekele"
            />
          </div>
          <div class="email">
            <label for="email">Email Address: </label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="abebe@gmail.com"
            />
          </div>
          <div class="message">
            <label for="message">message: </label>
            <textarea
              name="message"
              id="message"
              rows="4"
              cols="50"
              placeholder="Write Your message Here...."
              maxlength="400"
            ></textarea>
          </div>
          <div class="button"><button type="submit">Submit</button></div>
        </fieldset>
      </form>
      <div class="find">
        <p>You can find us here</p>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d156165.91357218736!2d38.69557204952648!3d8.963337265524718!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x164b85cef5ab402d%3A0x8467b6b037a24d49!2sAddis%20Ababa!5e1!3m2!1sen!2set!4v1785867942972!5m2!1sen!2set"
          title="maps"
          name="iframe"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </main>
    <footer class="footer">
      <p>&copy; 2026 Habesha Eatery. All right reserved.</p>
      <div class="footer-links">
        <a href="#">Private Policy</a>
        <a href="#">Term of Services</a>
        <a href="#">Contact Us</a>
      </div>
    </footer>
  </body>
</html>
