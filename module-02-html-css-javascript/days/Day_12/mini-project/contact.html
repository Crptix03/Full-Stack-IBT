<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Habesha Eatery, Bole</title>
    <meta
      name="description"
      content="Get in touch with Habesha Eatery in Bole, Addis Ababa."
    />
  </head>
  <body>
    <header>
      <h1>Contact Habesha Eatery</h1>
    </header>
    <nav>
      <a
        href="/sq2-horenus-dessalegn/module-02-html-css-javascript/Days/Day_12/in_class_exercise.html"
        >Reservations</a
      >
    </nav>
    <main>
      <form action="/contact" method="post">
        <br />
        <br />
        <label for="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          required
          placeholder="Alewu Bekele"
        />
        <br />
        <br />
        <label for="email">Email Address: </label>
        <input
          type="email"
          id="email"
          required
          autocomplete="email"
          placeholder="abebe@gmail.com"
        />
        <br />
        <br />
        <label for="message ">message: </label>
        <textarea
          name="message"
          id="message"
          rows="4"
          cols="50"
          placeholder="Write Your message Here...."
          maxlength="400"
          pattern="[0-9]{9}"
        ></textarea>
      </form>
    </main>
    <footer>Bole, Addis Ababa</footer>
  </body>
</html>
