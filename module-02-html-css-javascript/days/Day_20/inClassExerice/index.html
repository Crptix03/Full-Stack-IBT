<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie & Series Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>🎬 Movie & Series Search</h1>
      <p class="subtitle">Search by title to find movies & series.</p>
    </header>

    <main class="container">
      <form id="search-form" class="search-form">
        <input
          type="text"
          id="search-input"
          placeholder="e.g. Avengers, The Godfather..."
          autocomplete="off"
          required
        />
        <button type="submit" id="search-btn">Search</button>
      </form>

      <!-- Loading state -->
      <div id="loading-state" class="state-box hidden">
        <div class="spinner"></div>
        <p>Finding movies & series for you...</p>
      </div>

      <!-- Error state -->
      <div id="error-state" class="state-box hidden">
        <p id="error-message">Something went wrong. Please try again.</p>
        <button id="retry-btn">Retry</button>
      </div>

      <!-- Empty state -->
      <div id="empty-state" class="state-box hidden">
        <p>No movies or series found. Try a different search.</p>
      </div>

      <!-- Results -->
      <section id="results-grid" class="results-grid"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
