<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Country Facts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <p class="eyebrow">Field Atlas</p>
      <h1>Country Facts</h1>

      <form id="search-form">
        <input
          type="text"
          id="country-input"
          placeholder="Search a country..."
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>

      <div id="facts"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
